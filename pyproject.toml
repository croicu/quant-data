[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-data"
version = "0.1.0"
description = "PostgreSQL warehouse for market data — 1-minute OHLCV bars by ticker, date, and time."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "psycopg[binary]>=3.1",
    "yfinance>=0.2.28",
    "sshtunnel>=0.4",
    "ib_async>=1.0",
    "requests>=2.31",
]

[project.scripts]
quant-ingest = "ingest.cli:main"
quant-stage = "stage.cli:main"
quant-reconcile = "reconcile.cli:main"
quant-dispatch = "dispatch.cli:main"
quant-schedule = "schedule.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "ipykernel>=6.29",
]
# For .exp/ (tasks/ibkr_massive_mad_calibration.md) only -- not part of what quant-scratch
# or anyone else installs quant_data for, so kept out of the base dependencies list. pandas/numpy
# are already present transitively via yfinance; declared here explicitly since .exp/ code
# depends on them directly. pyarrow/matplotlib are genuinely new (parquet + .png outputs).
experiments = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
