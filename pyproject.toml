[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-data"
version = "0.1.0"
description = "PostgreSQL warehouse for market data — 1-minute OHLCV bars by ticker, date, and time."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "psycopg[binary]>=3.1",
    "yfinance>=0.2.28",
]

[project.scripts]
quant-ingest = "quant_data.ingest.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
